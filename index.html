<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>たくや バースデイ オリパ★</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  background:linear-gradient(135deg,#fff3c4,#ffd6e7 45%,#d7e9ff);
  color:#222;
  overflow-x:hidden;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:28px 16px 60px;
}

.card{
  background:#ffffffdf;
  backdrop-filter:blur(8px);
  border-radius:24px;
  padding:24px;
  box-shadow:0 12px 40px #0002;
  margin-bottom:18px;
}

h1{
  text-align:center;
  font-size:clamp(25px,6vw,46px);
  margin:5px 0 8px;
  color:#d4145a;
  text-shadow:2px 2px #fff;
}

.sub{
  text-align:center;
  font-weight:800;
  font-size:18px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:20px 0;
}

.stat{
  background:#fff;
  border-radius:16px;
  padding:18px;
  text-align:center;
}

.num{
  font-size:30px;
  font-weight:900;
  color:#d4145a;
}

button{
  border:0;
  border-radius:999px;
  padding:16px 28px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

.mainbtn{
  display:block;
  margin:12px auto;
  background:#d4145a;
  color:#fff;
  box-shadow:0 8px 20px #d4145a55;
  transition:.2s;
}

.mainbtn:hover{
  transform:scale(1.04);
}

.mainbtn:active{
  transform:scale(.96);
}

.mainbtn:disabled{
  opacity:.4;
  cursor:not-allowed;
  transform:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.prize{
  padding:16px;
  border-radius:16px;
  background:#fff;
  border:2px solid #eee;
}

.prize.S{
  border-color:#f1b400;
}

.prize.A{
  border-color:#d4145a;
}

.prize.B{
  border-color:#7b61ff;
}

.left{
  margin-top:12px;
  font-size:20px;
  font-weight:900;
  color:#d4145a;
}

.notice{
  font-size:13px;
  color:#666;
  text-align:center;
}

.hidden{
  display:none!important;
}


/* =========================
   ログイン
========================= */

.login{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#fff3c4,#ffd6e7,#d7e9ff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.loginbox{
  max-width:430px;
  width:100%;
  background:#fff;
  padding:30px;
  border-radius:25px;
  box-shadow:0 20px 60px #0003;
  text-align:center;
}

.loginbox input{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:18px;
  margin:14px 0;
}

.err{
  color:#d4145a;
  font-weight:700;
  min-height:24px;
}


/* =========================
   ガチャ画面
========================= */

.gachaOverlay{
  position:fixed;
  inset:0;
  background:rgba(20,10,30,.88);
  z-index:7000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.gachaBox{
  width:min(520px,100%);
  text-align:center;
  color:#fff;
}

.gachaCount{
  font-size:20px;
  font-weight:900;
  margin-bottom:20px;
}

.cardArea{
  perspective:1000px;
  height:360px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.gachaCard{
  width:260px;
  height:350px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .7s;
}

.gachaCard.flip{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:25px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  box-shadow:0 20px 60px #0008;
}

.back{
  background:
    radial-gradient(circle at center,#d4145a 0,#9b0e43 45%,#4d0624 100%);
  border:8px solid #ffd166;
  color:#fff;
}

.backIcon{
  font-size:80px;
}

.front{
  transform:rotateY(180deg);
  background:#fff;
  color:#222;
}

.frontRank{
  font-size:34px;
  font-weight:1000;
}

.frontName{
  font-size:22px;
  font-weight:900;
  margin-top:15px;
}

.frontPos{
  margin-top:20px;
  color:#777;
}


/* =========================
   賞ごとのカード
========================= */

.front.C{
  border:5px solid #ccc;
}

.front.B{
  border:6px solid #7b61ff;
  box-shadow:0 0 40px #7b61ff88;
}

.front.A{
  border:7px solid #d4145a;
  box-shadow:0 0 60px #d4145aaa;
}

.front.S{
  border:9px solid #f1b400;
  box-shadow:
    0 0 30px #fff,
    0 0 70px #f1b400,
    0 0 120px #f1b400;
}


/* =========================
   結果
========================= */

.resultCard{
  margin-top:20px;
}

.resultTitle{
  text-align:center;
  font-size:30px;
  font-weight:1000;
  color:#d4145a;
}

.result{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:20px;
}

.tile{
  min-height:120px;
  background:#fff;
  border-radius:16px;
  padding:12px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  box-shadow:0 5px 15px #0001;
  animation:appear .45s ease;
}

.tile .rank{
  font-size:20px;
  font-weight:1000;
}

.tile.S{
  border:4px solid #f1b400;
}

.tile.A{
  border:3px solid #d4145a;
}

.tile.B{
  border:3px solid #7b61ff;
}

@keyframes appear{
  0%{
    transform:scale(.5);
    opacity:0;
  }

  70%{
    transform:scale(1.08);
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}


/* =========================
   演出
========================= */

.flash{
  position:fixed;
  inset:0;
  z-index:8000;
  pointer-events:none;
  opacity:0;
}

.flash.show{
  animation:flash .8s ease;
}

@keyframes flash{
  0%{
    opacity:0;
  }

  25%{
    opacity:1;
  }

  60%{
    opacity:.5;
  }

  100%{
    opacity:0;
  }
}

.bigEffect{
  position:fixed;
  inset:0;
  z-index:8500;
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
  opacity:0;
}

.bigEffect.show{
  animation:bigEffect .9s ease;
}

.bigEffectText{
  font-size:clamp(45px,12vw,120px);
  font-weight:1000;
  text-align:center;
  color:#fff;
  text-shadow:
    0 0 10px #fff,
    0 0 30px #d4145a,
    0 0 70px #f1b400;
}

@keyframes bigEffect{
  0%{
    opacity:0;
    transform:scale(.3);
  }

  25%{
    opacity:1;
    transform:scale(1.15);
  }

  70%{
    opacity:1;
    transform:scale(1);
  }

  100%{
    opacity:0;
    transform:scale(1.2);
  }
}


/* =========================
   紙吹雪
========================= */

.confetti{
  position:fixed;
  top:-20px;
  width:10px;
  height:18px;
  z-index:9000;
  pointer-events:none;
  animation:fall linear forwards;
}

@keyframes fall{
  from{
    transform:translateY(-20px) rotate(0);
  }

  to{
    transform:translateY(110vh) rotate(720deg);
  }
}


/* =========================
   ガチャ開始
========================= */

.loadingText{
  font-size:30px;
  font-weight:1000;
  animation:pulse .6s infinite alternate;
}

@keyframes pulse{
  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.12);
  }
}


/* =========================
   スマホ
========================= */

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .result{
    grid-template-columns:repeat(2,1fr);
  }

  .cardArea{
    height:330px;
  }

  .gachaCard{
    width:230px;
    height:315px;
  }

  .tile{
    min-height:110px;
  }

}
</style>

<script>


/* =========================
   設定
========================= */

const PASSWORD =
  "takuya";

const TOTAL =
  200;

const DAILY_LIMIT =
  5;


/* =========================
   当たり位置
========================= */

const fixed = {

  33:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  66:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  71:{
    rank:"A賞",
    name:"キチチギスex SAR"
  },

  99:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  125:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  168:{
    rank:"A賞",
    name:"ミュウex SSR"
  },

  188:{
    rank:"S賞",
    name:"何かの未開封BOX（シュリンク付き）"
  }

};


/* =========================
   音
========================= */

let audioCtx = null;


function startAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioCtx.state === "suspended"
  ){

    audioCtx.resume();

  }

}


function tone(
  frequency,
  duration,
  type="sine",
  volume=.12
){

  startAudio();

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type =
    type;

  osc.frequency.setValueAtTime(
    frequency,
    audioCtx.currentTime
  );

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime + duration
  );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime + duration
  );

}


/* =========================
   ガチャ開始音
========================= */

function gachaSound(){

  startAudio();

  const notes=[
    220,
    260,
    310,
    370,
    440,
    520
  ];

  notes.forEach(
    (n,i)=>{

      setTimeout(
        ()=>{
          tone(
            n,
            .12,
            "square",
            .08
          );
        },
        i*90
      );

    }
  );

}


/* =========================
   C賞音
========================= */

function cSound(){

  tone(
    450,
    .12,
    "sine",
    .08
  );

}


/* =========================
   B賞音
========================= */

function bSound(){

  tone(
    600,
    .15,
    "triangle",
    .18
  );

  setTimeout(
    ()=>{
      tone(
        900,
        .25,
        "triangle",
        .18
      );
    },
    130
  );

}


/* =========================
   A賞音
========================= */

function aSound(){

  tone(
    700,
    .18,
    "triangle",
    .2
  );

  setTimeout(
    ()=>{
      tone(
        1000,
        .18,
        "triangle",
        .2
      );
    },
    120
  );

  setTimeout(
    ()=>{
      tone(
        1400,
        .4,
        "triangle",
        .22
      );
    },
    240
  );

}


/* =========================
   S賞音
========================= */

function sSound(){

  const notes=[
    523,
    659,
    784,
    1046,
    1318,
    1568
  ];

  notes.forEach(
    (n,i)=>{

      setTimeout(
        ()=>{
          tone(
            n,
            .35,
            "triangle",
            .25
          );
        },
        i*160
      );

    }
  );

}


/* =========================
   日付
========================= */

function todayKey(){

  return new Date()
    .toLocaleDateString(
      "ja-JP"
    );

}


/* =========================
   データ
========================= */

function load(){

  let d;

  try{

    d =
      JSON.parse(
        localStorage.getItem(
          "oripaData"
        ) || "null"
      );

  }catch(e){

    d=null;

  }


  if(
    !d ||
    d.date !== todayKey()
  ){

    d={

      date:todayKey(),

      daily:0,

      next:1

    };

  }


  return d;

}


function save(d){

  localStorage.setItem(
    "oripaData",
    JSON.stringify(d)
  );

}


/* =========================
   ログイン
========================= */

function login(){

  const input =
    document
      .getElementById("pw")
      .value
      .trim();

  if(
    input === PASSWORD
  ){

    sessionStorage.setItem(
      "oripaLogin",
      "true"
    );

    document
      .getElementById("login")
      .classList
      .add("hidden");

    document
      .getElementById("err")
      .textContent="";

  }else{

    document
      .getElementById("err")
      .textContent=
        "パスワードが違います";

  }

}


/* Enter */

document
  .getElementById("pw")
  .addEventListener(
    "keydown",
    function(e){

      if(
        e.key === "Enter"
      ){
        login();
      }

    }
  );


/* ログイン済み */

if(
  sessionStorage.getItem(
    "oripaLogin"
  ) === "true"
){

  document
    .getElementById("login")
    .classList
    .add("hidden");

}


/* =========================
   残り賞数
========================= */

function calculateRemaining(){

  const d =
    load();


  let s=1;
  let a=2;
  let b=4;


  for(
    let i=1;
    i<d.next;
    i++
  ){

    if(
      fixed[i]
    ){

      if(
        fixed[i].rank === "S賞"
      ){
        s--;
      }

      if(
        fixed[i].rank === "A賞"
      ){
        a--;
      }

      if(
        fixed[i].rank === "B賞"
      ){
        b--;
      }

    }

  }


  const drawn =
    d.next-1;


  const c =
    Math.max(
      0,
      193 -
      (
        drawn -
        (
          (1-s)+
          (2-a)+
          (4-b)
        )
      )
    );


  return {
    s:Math.max(0,s),
    a:Math.max(0,a),
    b:Math.max(0,b),
    c:c
  };

}


/* =========================
   表示更新
========================= */

function update(){

  const d =
    load();


  save(d);


  document
    .getElementById(
      "remaining"
    )
    .textContent =
      Math.max(
        0,
        TOTAL+1-d.next
      );


  document
    .getElementById(
      "daily"
    )
    .textContent =
      Math.max(
        0,
        DAILY_LIMIT-d.daily
      );


  document
    .getElementById(
      "draw"
    )
    .disabled =
      d.daily>=DAILY_LIMIT ||
      d.next>TOTAL;


  const r =
    calculateRemaining();


  document
    .getElementById(
      "sLeft"
    )
    .textContent =
      r.s;


  document
    .getElementById(
      "aLeft"
    )
    .textContent =
      r.a;


  document
    .getElementById(
      "bLeft"
    )
    .textContent =
      r.b;


  document
    .getElementById(
      "cLeft"
    )
    .textContent =
      r.c;

}


/* =========================
   派手な演出
========================= */

function bigEffect(text){

  const el =
    document.getElementById(
      "bigEffect"
    );

  document
    .getElementById(
      "bigEffectText"
    )
    .textContent =
      text;


  el.classList.remove(
    "show"
  );

  void el.offsetWidth;

  el.classList.add(
    "show"
  );

}


/* =========================
   紙吹雪
========================= */

function confetti(){

  for(
    let i=0;
    i<100;
    i++
  ){

    const c =
      document.createElement(
        "div"
      );

    c.className=
      "confetti";


    c.style.left =
      Math.random()*100+"%";


    c.style.background =
      [
        "#ff4d6d",
        "#ffd166",
        "#06d6a0",
        "#118ab2",
        "#8338ec"
      ][
        Math.floor(
          Math.random()*5
        )
      ];


    c.style.animationDuration =
      (2+
      Math.random()*3)
      +"s";


    document
      .body
      .appendChild(c);


    setTimeout(
      ()=>{
        c.remove();
      },
      5500
    );

  }

}


/* =========================
   1枚開封
========================= */

function showCard(
  card,
  index
){

  return new Promise(
    resolve=>{

      const overlay =
        document.getElementById(
          "gachaOverlay"
        );

      const count =
        document.getElementById(
          "gachaCount"
        );

      const loading =
        document.getElementById(
          "loadingText"
        );

      const area =
        document.getElementById(
          "cardArea"
        );

      const gachaCard =
        document.getElementById(
          "gachaCard"
        );

      const front =
        document.getElementById(
          "front"
        );


      loading.classList.add(
        "hidden"
      );

      area.classList.remove(
        "hidden"
      );


      count.textContent =
        "10連中 "+
        (index+1)+
        " / 10";


      gachaCard.classList.remove(
        "flip"
      );


      front.className =
        "face front " +
        (
          card.rank==="S賞"
            ?"S"
            :card.rank==="A賞"
              ?"A"
              :card.rank==="B賞"
                ?"B"
                :"C"
        );


      document
        .getElementById(
          "frontRank"
        )
        .textContent =
          card.rank;


      document
        .getElementById(
          "frontName"
        )
        .textContent =
          card.name;


      document
        .getElementById(
          "frontPos"
        )
        .textContent =
          card.position+
          "口目";


      /* まず少し待つ */

      setTimeout(
        ()=>{

          cSound();


          gachaCard.classList.add(
            "flip"
          );


          /* 賞演出 */

          if(
            card.rank==="B賞"
          ){

            setTimeout(
              ()=>{
                bSound();

                bigEffect(
                  "🔥 B賞！！ 🔥"
                );
              },
              500
            );

          }


          if(
            card.rank==="A賞"
          ){

            setTimeout(
              ()=>{
                aSound();

                bigEffect(
                  "✨ A賞！！ ✨"
                );
              },
              500
            );

          }


          if(
            card.rank==="S賞"
          ){

            setTimeout(
              ()=>{
                sSound();

                bigEffect(
                  "🎉 S賞 大当たり！！ 🎉"
                );

                confetti();

              },
              500
            );

          }


          setTimeout(
            resolve,
            card.rank==="S賞"
              ?1800
              :card.rank==="A賞"
                ?1500
                :1200
          );

        },
        500
      );

    }
  );

}


/* =========================
   10連
========================= */

async function draw10(){

  const d =
    load();


  if(
    d.daily>=DAILY_LIMIT ||
    d.next>TOTAL
  ){
    return;
  }


  startAudio();


  const button =
    document.getElementById(
      "draw"
    );


  button.disabled=true;


  /* 今回の10枚 */

  const cards=[];


  for(
    let i=0;
    i<10 &&
    d.next<=TOTAL;
    i++
  ){

    const position =
      d.next;


    cards.push({

      position:position,

      ...(fixed[position]||{

        rank:"C賞",

        name:"ハズレ"

      })

    });


    d.next++;

  }


  d.daily++;


  save(d);


  update();


  /* ガチャ開始 */

  const overlay =
    document.getElementById(
      "gachaOverlay"
    );


  const loading =
    document.getElementById(
      "loadingText"
    );


  const area =
    document.getElementById(
      "cardArea"
    );


  overlay.classList.remove(
    "hidden"
  );


  area.classList.add(
    "hidden"
  );


  loading.classList.remove(
    "hidden"
  );


  loading.textContent =
    "🎰 ガチャ開始！！";


  gachaSound();


  await new Promise(
    r=>setTimeout(
      r,
      1000
    )
  );


  /* 1枚ずつ開封 */

  for(
    let i=0;
    i<cards.length;
    i++
  ){

    await showCard(
      cards[i],
      i
    );

  }


  /* ガチャ終了 */

  overlay.classList.add(
    "hidden"
  );


  /* 結果 */

  const resultCard =
    document.getElementById(
      "resultCard"
    );


  const result =
    document.getElementById(
      "result"
    );


  const title =
    document.getElementById(
      "resultTitle"
    );


  result.innerHTML="";


  const hasS =
    cards.some(
      c=>c.rank==="S賞"
    );


  const hasA =
    cards.some(
      c=>c.rank==="A賞"
    );


  const hasB =
    cards.some(
      c=>c.rank==="B賞"
    );


  title.textContent =
    hasS
      ?"🎉🎉 S賞 大当たり！！ 🎉🎉"
      :hasA
        ?"✨ A賞 当選！！ ✨"
        :hasB
          ?"🔥 B賞 当選！！ 🔥"
          :"10連結果";


  cards.forEach(
    c=>{

      const el =
        document.createElement(
          "div"
        );


      const cls =
        c.rank==="S賞"
          ?"S"
          :c.rank==="A賞"
            ?"A"
            :c.rank==="B賞"
              ?"B"
              :"";


      el.className =
        "tile "+cls;


      el.innerHTML =

        "<div class='rank'>"+
        c.rank+
        "</div>"+

        "<div>"+
        c.name+
        "</div>"+

        "<small>"+
        c.position+
        "口目"+
        "</small>";


      result.appendChild(
        el
      );

    }
  );


  resultCard.classList.remove(
    "hidden"
  );


  update();


  resultCard.scrollIntoView({
    behavior:"smooth"
  });

}


/* =========================
   初期表示
========================= */

update();


/* =========================
   0:00更新チェック
========================= */

setInterval(
  ()=>{
    update();
  },
  10000
);

</script>
