<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>たくや バースデイ オリパ★</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  background:linear-gradient(135deg,#fff3c4,#ffd6e7 45%,#d7e9ff);
  color:#222;
  overflow-x:hidden;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:28px 16px 60px;
}

.card{
  background:#ffffffdf;
  backdrop-filter:blur(8px);
  border-radius:24px;
  padding:24px;
  box-shadow:0 12px 40px #0002;
  margin-bottom:18px;
}

h1{
  text-align:center;
  font-size:clamp(25px,6vw,46px);
  margin:5px 0 8px;
  color:#d4145a;
  text-shadow:2px 2px #fff;
}

.sub{
  text-align:center;
  font-weight:800;
  font-size:18px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:20px 0;
}

.stat{
  background:#fff;
  border-radius:16px;
  padding:18px;
  text-align:center;
}

.num{
  font-size:30px;
  font-weight:900;
  color:#d4145a;
}

button{
  border:0;
  border-radius:999px;
  padding:16px 28px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

.mainbtn{
  display:block;
  margin:12px auto;
  background:#d4145a;
  color:#fff;
  box-shadow:0 8px 20px #d4145a55;
  transition:.2s;
}

.mainbtn:hover{
  transform:scale(1.04);
}

.mainbtn:active{
  transform:scale(.96);
}

.mainbtn:disabled{
  opacity:.4;
  cursor:not-allowed;
  transform:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.prize{
  padding:16px;
  border-radius:16px;
  background:#fff;
  border:2px solid #eee;
}

.S{
  border-color:#f1b400;
}

.A{
  border-color:#d4145a;
}

.B{
  border-color:#7b61ff;
}

.result{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:18px;
}

.tile{
  min-height:120px;
  background:#fff;
  border-radius:16px;
  padding:12px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  box-shadow:0 5px 15px #0001;
  opacity:0;
  transform:scale(.5) rotate(-5deg);
}

.tile.show{
  animation:cardIn .45s ease forwards;
}

.tile .rank{
  font-weight:900;
  font-size:20px;
}

.tile.C{
  color:#777;
}

.tile.B{
  border:3px solid #7b61ff;
}

.tile.A{
  border:3px solid #d4145a;
}

.tile.S{
  border:4px solid #f1b400;
}

.big{
  font-size:28px;
  font-weight:1000;
  color:#d4145a;
  text-align:center;
}

.notice{
  font-size:13px;
  color:#666;
  text-align:center;
}

.hidden{
  display:none !important;
}


/* =========================
   ログイン
========================= */

.login{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#fff3c4,#ffd6e7,#d7e9ff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.loginbox{
  max-width:430px;
  width:100%;
  background:#fff;
  padding:30px;
  border-radius:25px;
  box-shadow:0 20px 60px #0003;
  text-align:center;
}

.loginbox input{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:18px;
  margin:14px 0;
}

.err{
  color:#d4145a;
  font-weight:700;
  min-height:24px;
}


/* =========================
   演出オーバーレイ
========================= */

.effect{
  position:fixed;
  inset:0;
  z-index:8000;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:0;
}

.effect.show{
  animation:effectFlash .8s ease;
}

.effectText{
  font-size:clamp(40px,12vw,110px);
  font-weight:1000;
  text-align:center;
  color:#fff;
  text-shadow:
    0 0 10px #fff,
    0 0 25px #d4145a,
    0 0 50px #d4145a;
}

@keyframes effectFlash{

  0%{
    opacity:0;
    background:#fff0;
  }

  25%{
    opacity:1;
    background:#fff9;
  }

  60%{
    opacity:1;
    background:#fff3;
  }

  100%{
    opacity:0;
    background:#fff0;
  }

}


/* =========================
   カード出現
========================= */

@keyframes cardIn{

  0%{
    opacity:0;
    transform:scale(.4) rotate(-8deg);
  }

  60%{
    opacity:1;
    transform:scale(1.12) rotate(3deg);
  }

  100%{
    opacity:1;
    transform:scale(1) rotate(0);
  }

}


/* =========================
   S賞用画面
========================= */

.splash{
  position:fixed;
  inset:0;
  z-index:8500;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
}

.splash.show{
  animation:splash .9s ease;
}

.splashText{
  text-align:center;
  font-size:clamp(45px,13vw,130px);
  font-weight:1000;
  color:#d4145a;
  text-shadow:
    0 0 15px #fff,
    0 0 30px #f1b400;
}

@keyframes splash{

  0%{
    opacity:0;
    transform:scale(.5);
  }

  25%{
    opacity:1;
    transform:scale(1.1);
  }

  70%{
    opacity:1;
    transform:scale(1);
  }

  100%{
    opacity:0;
    transform:scale(1.2);
  }

}


/* =========================
   紙吹雪
========================= */

.confetti{
  position:fixed;
  top:-20px;
  width:10px;
  height:18px;
  z-index:9000;
  pointer-events:none;
  animation:fall linear forwards;
}

@keyframes fall{

  0%{
    transform:translateY(-20px) rotate(0deg);
  }

  100%{
    transform:translateY(110vh) rotate(720deg);
  }

}


/* =========================
   10連中
========================= */

.drawing{
  animation:shake .35s infinite;
}

@keyframes shake{

  0%{
    transform:rotate(0);
  }

  25%{
    transform:rotate(-2deg);
  }

  50%{
    transform:rotate(2deg);
  }

  75%{
    transform:rotate(-2deg);
  }

  100%{
    transform:rotate(0);
  }

}


@media(max-width:600px){

  .result{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:1fr;
  }

  h1{
    line-height:1.15;
  }

  .tile{
    min-height:110px;
  }

}

</style>
</head>

<body>


<!-- =========================
     ログイン画面
========================= -->

<div id="login" class="login">

  <div class="loginbox">

    <div style="font-size:44px">
      🎂
    </div>

    <h1 style="font-size:30px">
      たくや バースデイ<br>
      オリパ★
    </h1>

    <p>
      友達限定ページ
    </p>

    <input
      id="pw"
      type="password"
      placeholder="パスワード"
      autocomplete="off"
    >

    <button
      type="button"
      class="mainbtn"
      onclick="login()"
    >
      ログイン
    </button>

    <div
      id="err"
      class="err"
    ></div>

  </div>

</div>


<!-- =========================
     演出
========================= -->

<div
  id="effect"
  class="effect"
>

  <div
    id="effectText"
    class="effectText"
  ></div>

</div>


<div
  id="splash"
  class="splash"
>

  <div class="splashText">
    🎉 S賞！！ 🎉
  </div>

</div>


<!-- =========================
     メイン
========================= -->

<main class="wrap">

  <div class="card">

    <h1>
      総還元率∞％！！<br>
      たくや バースデイ オリパ★
    </h1>

    <div class="sub">
      🎉 10連限定・バースデイスペシャル 🎉
    </div>


    <div class="stats">

      <div class="stat">

        残り口数

        <div
          class="num"
          id="remaining"
        >
          500
        </div>

        <small>
          / 500
        </small>

      </div>


      <div class="stat">

        本日の残り回数

        <div
          class="num"
          id="daily"
        >
          5
        </div>

        <small>
          / 5 回
        </small>

      </div>

    </div>


    <button
      id="draw"
      class="mainbtn"
      type="button"
      onclick="draw10()"
    >
      🎰 10連を引く！
    </button>


    <div class="notice">
      ※この試作品ではブラウザ内にデータを保存します。
    </div>

  </div>


  <!-- =========================
       結果
  ========================= -->

  <div
    id="resultCard"
    class="card hidden"
  >

    <div
      id="resultTitle"
      class="big"
    >
      10連結果
    </div>

    <div
      id="result"
      class="result"
    ></div>

  </div>


  <!-- =========================
       ラインナップ
  ========================= -->

  <div class="card">

    <h2>
      🎁 公開ラインナップ
    </h2>

    <div class="grid">

      <div class="prize S">
        <b>S賞 ×1</b><br>
        何かの未開封BOX（シュリンク付き）
      </div>

      <div class="prize A">
        <b>A賞 ×1</b><br>
        キチチギスex SAR
      </div>

      <div class="prize A">
        <b>A賞 ×1</b><br>
        ミュウex SAR
      </div>

      <div class="prize B">
        <b>B賞 ×4</b><br>
        夜のタンカ SR
      </div>

      <div class="prize">
        <b>C賞 ×493</b><br>
        ハズレ
      </div>

    </div>

  </div>

</main>


<script>


/* =========================
   パスワード
========================= */

const PASSWORD = "takuya";


/* =========================
   上位賞固定位置
========================= */

const fixed = {

  49:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  136:{
    rank:"A賞",
    name:"キチチギスex SAR"
  },

  267:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  282:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  345:{
    rank:"A賞",
    name:"ミュウex SAR"
  },

  444:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  500:{
    rank:"S賞",
    name:"何かの未開封BOX（シュリンク付き）"
  }

};


/* =========================
   Audio
========================= */

let audioCtx = null;


function startAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioCtx.state === "suspended"
  ){

    audioCtx.resume();

  }

}


/* =========================
   単音
========================= */

function tone(
  frequency,
  duration,
  type="sine",
  volume=.15
){

  startAudio();

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type = type;

  osc.frequency.setValueAtTime(
    frequency,
    audioCtx.currentTime
  );

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime + duration
  );

}


/* =========================
   ガチャ音
========================= */

function playGacha(){

  startAudio();

  const notes = [
    220,
    260,
    310,
    370,
    440,
    520
  ];

  notes.forEach(
    (n,i)=>{

      setTimeout(
        ()=>{
          tone(
            n,
            .12,
            "square",
            .08
          );
        },
        i*90
      );

    }
  );

}


/* =========================
   カード音
========================= */

function playCardSound(){

  tone(
    700,
    .12,
    "sine",
    .12
  );

}


/* =========================
   B賞音
========================= */

function playBSound(){

  tone(
    600,
    .15,
    "triangle",
    .18
  );

  setTimeout(
    ()=>{
      tone(
        900,
        .25,
        "triangle",
        .18
      );
    },
    120
  );

}


/* =========================
   A賞音
========================= */

function playASound(){

  tone(
    700,
    .18,
    "triangle",
    .2
  );

  setTimeout(
    ()=>{
      tone(
        1000,
        .18,
        "triangle",
        .2
      );
    },
    120
  );

  setTimeout(
    ()=>{
      tone(
        1400,
        .35,
        "triangle",
        .2
      );
    },
    240
  );

}


/* =========================
   S賞ファンファーレ
========================= */

function playSSound(){

  const notes = [
    523,
    659,
    784,
    1046,
    1318
  ];

  notes.forEach(
    (n,i)=>{

      setTimeout(
        ()=>{
          tone(
            n,
            .35,
            "triangle",
            .25
          );
        },
        i*180
      );

    }
  );

}


/* =========================
   今日の日付
========================= */

function todayKey(){

  return new Date()
    .toLocaleDateString("ja-JP");

}


/* =========================
   データ読み込み
========================= */

function load(){

  try{

    const saved =
      localStorage.getItem(
        "oripaData"
      );

    let d =
      saved
        ? JSON.parse(saved)
        : null;

    if(
      !d ||
      d.date !== todayKey()
    ){

      d = {
        date:todayKey(),
        daily:0,
        next:1
      };

    }

    return d;

  }catch(e){

    return {
      date:todayKey(),
      daily:0,
      next:1
    };

  }

}


/* =========================
   保存
========================= */

function save(d){

  try{

    localStorage.setItem(
      "oripaData",
      JSON.stringify(d)
    );

  }catch(e){

    console.log(e);

  }

}


/* =========================
   ログイン
========================= */

function login(){

  const input =
    document
      .getElementById("pw")
      .value
      .trim();

  const err =
    document.getElementById("err");

  if(
    input === PASSWORD
  ){

    sessionStorage.setItem(
      "oripaLogin",
      "true"
    );

    document
      .getElementById("login")
      .classList
      .add("hidden");

    err.textContent = "";

  }else{

    err.textContent =
      "パスワードが違います";

  }

}


/* =========================
   Enter
========================= */

document
  .getElementById("pw")
  .addEventListener(
    "keydown",
    function(e){

      if(
        e.key === "Enter"
      ){

        login();

      }

    }
  );


/* =========================
   ログイン状態
========================= */

if(
  sessionStorage.getItem(
    "oripaLogin"
  ) === "true"
){

  document
    .getElementById("login")
    .classList
    .add("hidden");

}


/* =========================
   表示更新
========================= */

function update(){

  const d = load();

  save(d);

  document
    .getElementById("remaining")
    .textContent =
      Math.max(
        0,
        501 - d.next
      );

  document
    .getElementById("daily")
    .textContent =
      Math.max(
        0,
        5 - d.daily
      );

  document
    .getElementById("draw")
    .disabled =
      d.daily >= 5 ||
      d.next > 500;

}


/* =========================
   紙吹雪
========================= */

function confetti(){

  for(
    let i=0;
    i<80;
    i++
  ){

    const c =
      document.createElement(
        "div"
      );

    c.className =
      "confetti";

    c.style.left =
      Math.random()*100 + "%";

    c.style.animationDuration =
      (2 + Math.random()*3) + "s";

    c.style.animationDelay =
      Math.random()*1.5 + "s";

    c.style.background =
      [
        "#ff4d6d",
        "#ffd166",
        "#06d6a0",
        "#118ab2",
        "#8338ec"
      ][
        Math.floor(
          Math.random()*5
        )
      ];

    document
      .body
      .appendChild(c);

    setTimeout(
      ()=>{
        c.remove();
      },
      5500
    );

  }

}


/* =========================
   演出テキスト
========================= */

function showEffect(text){

  const effect =
    document.getElementById(
      "effect"
    );

  document
    .getElementById(
      "effectText"
    )
    .textContent = text;

  effect.classList.remove(
    "show"
  );

  void effect.offsetWidth;

  effect.classList.add(
    "show"
  );

}


/* =========================
   S賞演出
========================= */

function showS(){

  const splash =
    document.getElementById(
      "splash"
    );

  splash.classList.remove(
    "show"
  );

  void splash.offsetWidth;

  splash.classList.add(
    "show"
  );

  playSSound();

  confetti();

}


/* =========================
   10連
========================= */

async function draw10(){

  const d = load();

  if(
    d.daily >= 5 ||
    d.next > 500
  ){

    return;

  }


  /* 音を開始 */

  startAudio();

  playGacha();


  /* ボタン停止 */

  const button =
    document.getElementById(
      "draw"
    );

  button.disabled = true;

  button.classList.add(
    "drawing"
  );


  /* 結果データ */

  const cards = [];

  for(
    let i=0;
    i<10 && d.next<=500;
    i++
  ){

    const position =
      d.next;

    cards.push({

      position:position,

      ...(fixed[position] || {

        rank:"C賞",
        name:"ハズレ"

      })

    });

    d.next++;

  }


  d.daily++;

  save(d);

  update();


  /* 結果エリア */

  const resultCard =
    document.getElementById(
      "resultCard"
    );

  const result =
    document.getElementById(
      "result"
    );

  resultCard
    .classList
    .remove("hidden");

  result.innerHTML = "";


  /* タイトル */

  const hasS =
    cards.some(
      x => x.rank === "S賞"
    );

  const hasA =
    cards.some(
      x => x.rank === "A賞"
    );

  const hasB =
    cards.some(
      x => x.rank === "B賞"
    );


  document
    .getElementById(
      "resultTitle"
    )
    .textContent =

      hasS
        ? "🎉🎉 S賞 大当たり！！ 🎉🎉"

        : hasA
          ? "✨ A賞 当選！！ ✨"

          : hasB
            ? "🔥 B賞 当選！！ 🔥"

            : "10連結果";


  /* カードを順番に表示 */

  for(
    let i=0;
    i<cards.length;
    i++
  ){

    const c =
      cards[i];

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          280
        )
    );


    playCardSound();


    const el =
      document.createElement(
        "div"
      );


    let cls = "C";

    if(
      c.rank === "B賞"
    ){

      cls = "B";

    }

    if(
      c.rank === "A賞"
    ){

      cls = "A";

    }

    if(
      c.rank === "S賞"
    ){

      cls = "S";

    }


    el.className =
      "tile " +
      cls;


    el.innerHTML =

      "<div class='rank'>" +
      c.rank +
      "</div>" +

      "<div>" +
      c.name +
      "</div>" +

      "<small>" +
      c.position +
      "口目" +
      "</small>";


    result.appendChild(
      el
    );


    requestAnimationFrame(
      ()=>{
        el.classList.add(
          "show"
        );
      }
    );


    /* 上位賞演出 */

    if(
      c.rank === "B賞"
    ){

      playBSound();

      showEffect(
        "🔥 B賞！！ 🔥"
      );

    }


    if(
      c.rank === "A賞"
    ){

      playASound();

      showEffect(
        "✨ A賞！！ ✨"
      );

    }


    if(
      c.rank === "S賞"
    ){

      showS();

    }

  }


  button.classList.remove(
    "drawing"
  );

  update();


  resultCard.scrollIntoView({
    behavior:"smooth"
  });

}


/* =========================
   初期表示
========================= */

update();

</script>

</body>
</html>
