<script>

/* =========================
   基本設定
========================= */

const PASSWORD="takuya";

const TOTAL=15;


/* =========================
   当たり位置
========================= */

const fixed={

  3:{
    rank:"B賞",
    name:"夜のタンカ SR",
    image:"yoru.jpg"
  },

  6:{
    rank:"B賞",
    name:"夜のタンカ SR",
    image:"yoru.jpg"
  },

  7:{
    rank:"A賞",
    name:"キチチギスex SAR",
    image:"kitchikigisu.jpg"
  },

  9:{
    rank:"B賞",
    name:"夜のタンカ SR",
    image:"yoru.jpg"
  },

  11:{
    rank:"B賞",
    name:"夜のタンカ SR",
    image:"yoru.jpg"
  },

  12:{
    rank:"A賞",
    name:"ミュウex SSR",
    image:"mew.jpg"
  },

  14:{
    rank:"S賞",
    name:
      "何かの未開封BOX（シュリンク付き）"
  }

};


/* =========================
   Audio
========================= */

let audioCtx=null;


function startAudio(){

  if(!audioCtx){

    audioCtx=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

  }

  if(
    audioCtx.state==="suspended"
  ){

    audioCtx.resume();

  }

}


function tone(
  frequency,
  duration,
  type="sine",
  volume=.08
){

  startAudio();


  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();


  osc.type=type;

  osc.frequency.value=
    frequency;


  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+
    duration
  );


  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );


  osc.start();


  osc.stop(
    audioCtx.currentTime+
    duration
  );

}


/* =========================
   長めのペリペリ音
========================= */

function peelSound(){

  startAudio();


  const sounds=[
    145,165,190,175,205,
    230,215,245,265,240,
    280,300,275,315,335,
    300,350,365,340,380,
    395,370,410,430,400,
    440,460,445,475,490
  ];


  sounds.forEach(
    (n,i)=>{

      setTimeout(()=>{

        tone(
          n,
          .11,
          "triangle",
          .055
        );

      },i*100);

    }
  );

}


/* =========================

function bSound(){

}


/* =========================

function aSound(){

}


/* =========================

function sSound(){

    1318,

  ].forEach(
    (n,i)=>{

}


/* =========================
   データ
========================= */

function load(){

  let d=null;


  try{

    d=JSON.parse(
      localStorage.getItem(
        "oripaData"
      )||"null"
    );

  }catch(e){

    d=null;

  }


  if(
    !d||
    d.next===undefined
  ){

    d={
      next:1
    };

  }


  return d;

}


function save(d){

  localStorage.setItem(
    "oripaData",
    JSON.stringify(d)
  );

}


/* =========================
   ログイン
========================= */

function login(){

  const input=
    document
      .getElementById("pw")
      .value
      .trim();


  if(
    input===PASSWORD
  ){

    sessionStorage.setItem(
      "oripaLogin",
      "1"
    );


    document
      .getElementById("login")
      .classList
      .add("hidden");


    document
      .getElementById("err")
      .textContent="";

  }else{

    document
      .getElementById("err")
      .textContent=
        "パスワードが違います";

  }

}


document
  .getElementById("pw")
  .addEventListener(
    "keydown",
    e=>{

      if(e.key==="Enter"){
        login();
      }

    }
  );


if(
  sessionStorage.getItem(
    "oripaLogin"
  )==="1"
){

  document
    .getElementById("login")
    .classList
    .add("hidden");

}


/* =========================
   残り賞数計算
========================= */

function calculateRemaining(){

  const d=load();


  let s=1;
  let a=2;
  let b=4;


  for(
    let i=1;
    i<d.next;
    i++
  ){

    if(!fixed[i]){
      continue;
    }


    if(
      fixed[i].rank==="S賞"
    ){

      s--;

    }


    if(
      fixed[i].rank==="A賞"
    ){

      a--;

    }


    if(
      fixed[i].rank==="B賞"
    ){

      b--;

    }

  }


  const drawn=
    d.next-1;


  const special=
    (1-s)+
    (2-a)+
    (4-b);


  const c=
    Math.max(
      0,
      8-(drawn-special)
    );


  return{

    s:Math.max(0,s),

    a:Math.max(0,a),

    b:Math.max(0,b),

    c:c

  };

}


/* =========================
   表示更新
========================= */

function update(){

  const d=load();


  save(d);


  document
    .getElementById(
      "remaining"
    )
    .textContent=
      Math.max(
        0,
        TOTAL+1-d.next
      );


  document
    .getElementById(
      "draw"
    )
    .disabled=
      d.next>TOTAL;


  const r=
    calculateRemaining();


  document
    .getElementById(
      "sLeft"
    )
    .textContent=
      r.s;


  document
    .getElementById(
      "aLeft"
    )
    .textContent=
      r.a;


  document
    .getElementById(
      "bLeft"
    )
    .textContent=
      r.b;


  document
    .getElementById(
      "cLeft"
    )
    .textContent=
      r.c;

}


/* =========================
   ガチャ
========================= */

let currentCard=null;

let peeling=false;


function drawOne(){

  const d=load();


  if(
    d.next>TOTAL
  ){

    return;

  }


  startAudio();


  const position=
    d.next;


  currentCard={

    position:position,

    ...(fixed[position]||{

      rank:"C賞",

      name:"ハズレ"

    })

  };


  d.next++;


  save(d);


  update();


  document
    .getElementById(
      "resultCard"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "gachaOverlay"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "gachaCount"
    )
    .textContent=
      position+
      "口目";


  showCard();

}


/* =========================
   カード準備
========================= */

function showCard(){

  const inside=
    document.getElementById(
      "ticketInside"
    );


  let type="c";


  if(
    currentCard.rank==="S賞"
  ){

    type="s";

  }


  if(
    currentCard.rank==="A賞"
  ){

    type="a";

  }


  if(
    currentCard.rank==="B賞"
  ){

    type="b";

  }


  inside.className=
    "ticketInside "+
    type;


  document
    .getElementById(
      "insideRank"
    )
    .textContent=
      currentCard.rank;


  document
    .getElementById(
      "insideName"
    )
    .textContent=
      currentCard.name;


  document
    .getElementById(
      "insidePos"
    )
    .textContent=
      currentCard.position+
      "口目";


  const cover=
    document.getElementById(
      "peelCover"
    );


  cover.style.transition=
    "none";


  cover.style.transform=
    "translateX(0px) rotate(0deg)";


  cover.style.opacity="1";


  void cover.offsetWidth;


  cover.style.transition="";


  peeling=false;


  document
    .getElementById(
      "peelButton"
    )
    .disabled=false;

}


/* =========================
   ペリペリ
========================= */

function peel(){

  if(
    peeling||
    !currentCard
  ){

    return;

  }


  peeling=true;


  const cover=
    document.getElementById(
      "peelCover"
    );


  document
    .getElementById(
      "peelButton"
    )
    .disabled=true;


  peelSound();


  setTimeout(()=>{

    cover.style.transition=
      "transform 1.7s cubic-bezier(.2,.8,.2,1),opacity 1.7s";


    cover.style.transform=
      "translateX(110%) rotate(0deg)";


    cover.style.opacity="0";


  },50);


  setTimeout(()=>{

    revealPrize(
      currentCard
    );

  },1800);

}


/* =========================
   スライド操作
========================= */

let startX=0;

let dragging=false;


const peelCover=
  document.getElementById(
    "peelCover"
  );


peelCover.addEventListener(
  "pointerdown",
  e=>{

    if(peeling){
      return;
    }


    dragging=true;

    startX=e.clientX;


    peelCover.setPointerCapture(
      e.pointerId
    );

  }
);


peelCover.addEventListener(
  "pointermove",
  e=>{

    if(
      !dragging||
      peeling
    ){

      return;

    }


    const dx=
      Math.max(
        0,
        e.clientX-startX
      );


    peelCover.style.transform=
      "translateX("+
      Math.min(
        dx,
        130
      )+
      "px) rotate(0deg)";

  }
);


peelCover.addEventListener(
  "pointerup",
  e=>{

    if(!dragging){
      return;
    }


    dragging=false;


    const dx=
      e.clientX-startX;


    if(dx>70){

      peel();

    }else{

      peelCover.style.transition=
        "transform .25s ease";


      peelCover.style.transform=
        "translateX(0px) rotate(0deg)";

    }

  }
);


/* =========================
   大当たり演出
========================= */

function bigEffect(text){

  const box=
    document.getElementById(
      "bigEffect"
    );


  document
    .getElementById(
      "bigEffectText"
    )
    .textContent=text;


  box.classList.remove(
    "show"
  );


  void box.offsetWidth;


  box.classList.add(
    "show"
  );

}


function makeConfetti(){

  for(
    let i=0;
    i<100;
    i++
  ){

    const c=
      document.createElement(
        "div"
      );


    c.className=
      "confetti";


    c.style.left=
      Math.random()*
      100+
      "%";


    c.style.background=
      [
        "#ff4d6d",
        "#ffd166",
        "#06d6a0",
        "#118ab2",
        "#8338ec"
      ][
        Math.floor(
          Math.random()*5
        )
      ];


    c.style.animationDuration=
      2+
      Math.random()*2.5+
      "s";


    document
      .body
      .appendChild(c);


    setTimeout(
      ()=>{
        c.remove();
      },
      5000
    );

  }

}


/* =========================
   結果表示
========================= */

function revealPrize(card){

  if(
    card.rank==="B賞"
  ){

    bSound();


    setTimeout(
      ()=>{

        bigEffect(
          "🔥 B賞！！ 🔥"
        );

      },
      100
    );

  }


  if(
    card.rank==="A賞"
  ){

    aSound();


    setTimeout(
      ()=>{

        bigEffect(
          "✨ A賞！！ ✨"
        );

      },
      100
    );

  }


  if(
    card.rank==="S賞"
  ){

    sSound();


    setTimeout(
      ()=>{

        bigEffect(
          "🎉 S賞！！ 🎉"
        );


        makeConfetti();

      },
      100
    );

  }


  let wait=900;


  if(
    card.rank==="B賞"
  ){

    wait=1300;

  }


  if(
    card.rank==="A賞"
  ){

    wait=1600;

  }


  if(
    card.rank==="S賞"
  ){

    wait=2100;

  }


  setTimeout(
    ()=>{

      document
        .getElementById(
          "gachaOverlay"
        )
        .classList
        .add("hidden");


      showResult(card);

    },
    wait
  );

}


/* =========================
   リザルト
========================= */

function showResult(card){

  const result=
    document.getElementById(
      "result"
    );


  result.innerHTML="";


  const el=
    document.createElement(
      "div"
    );


  let cls="";


  if(
    card.rank==="S賞"
  ){

    cls="S";

  }


  if(
    card.rank==="A賞"
  ){

    cls="A";

  }


  if(
    card.rank==="B賞"
  ){

    cls="B";

  }


  el.className=
    "tile "+
    cls;


  let imageHTML="";


  if(card.image){

    imageHTML=
      "<img src=\""+
      card.image+
      "\" class=\"resultImage\" "+
      "alt=\""+
      card.name+
      "\">";

  }


  el.innerHTML=

    imageHTML+

    "<div class=\"rank\">"+
    card.rank+
    "</div>"+

    "<div class=\"name\">"+
    card.name+
    "</div>"+

    "<small>"+
    card.position+
    "口目"+
    "</small>";


  result.appendChild(el);


  document
    .getElementById(
      "resultTitle"
    )
    .textContent=

      card.rank==="S賞"

        ?"🎉🎉 S賞 大当たり！！ 🎉🎉"

        :card.rank==="A賞"

          ?"✨ A賞 当選！！ ✨"

          :card.rank==="B賞"

            ?"🔥 B賞 当選！！ 🔥"

            :"ガチャ結果";


  document
    .getElementById(
      "resultCard"
    )
    .classList
    .remove("hidden");


  update();


  document
    .getElementById(
      "resultCard"
    )
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =========================
   初期表示
========================= */

update();

</script>
