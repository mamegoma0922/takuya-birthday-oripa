<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>総還元率∞％！！ たくや バースデイ オリパ★</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  background:linear-gradient(135deg,#fff3c4,#ffd6e7 45%,#d7e9ff);
  color:#222;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:28px 16px 60px;
}

.card{
  background:#ffffffdf;
  backdrop-filter:blur(8px);
  border-radius:24px;
  padding:24px;
  box-shadow:0 12px 40px #0002;
  margin-bottom:18px;
}

h1{
  text-align:center;
  font-size:clamp(25px,6vw,46px);
  margin:5px 0 8px;
  color:#d4145a;
  text-shadow:2px 2px #fff;
}

.sub{
  text-align:center;
  font-weight:800;
  font-size:18px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:20px 0;
}

.stat{
  background:#fff;
  border-radius:16px;
  padding:18px;
  text-align:center;
}

.num{
  font-size:30px;
  font-weight:900;
  color:#d4145a;
}

button{
  border:0;
  border-radius:999px;
  padding:16px 28px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

.mainbtn{
  display:block;
  margin:12px auto;
  background:#d4145a;
  color:#fff;
  box-shadow:0 8px 20px #d4145a55;
}

.mainbtn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.prize{
  padding:16px;
  border-radius:16px;
  background:#fff;
  border:2px solid #eee;
}

.prize.S{
  border-color:#f1b400;
}

.prize.A{
  border-color:#d4145a;
}

.prize.B{
  border-color:#7b61ff;
}

.left{
  margin-top:10px;
  font-size:20px;
  font-weight:900;
  color:#d4145a;
}

.notice{
  font-size:13px;
  color:#666;
  text-align:center;
}

.hidden{
  display:none!important;
}


/* =========================
   LOGIN
========================= */

.login{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#fff3c4,#ffd6e7,#d7e9ff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.loginbox{
  max-width:430px;
  width:100%;
  background:#fff;
  padding:30px;
  border-radius:25px;
  box-shadow:0 20px 60px #0003;
  text-align:center;
}

.loginbox input{
  width:100%;
  padding:15px;
  border:2px solid #ddd;
  border-radius:12px;
  font-size:18px;
  margin:14px 0;
}

.err{
  color:#d4145a;
  font-weight:700;
  min-height:24px;
}


/* =========================
   ガチャ画面
========================= */

.gachaOverlay{
  position:fixed;
  inset:0;
  background:rgba(20,10,25,.94);
  z-index:7000;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:15px;
}

.gachaBox{
  width:min(500px,100%);
  text-align:center;
  color:white;
}

.gachaTitle{
  font-size:27px;
  font-weight:1000;
  margin-bottom:8px;
}

.gachaCount{
  font-size:17px;
  font-weight:900;
  margin-bottom:15px;
}


/* =========================
   チケット
========================= */

.peelArea{
  position:relative;

  width:min(390px,92vw);
  height:490px;

  margin:auto;
}

.ticket{
  position:absolute;
  inset:0;

  background:white;

  border-radius:25px;

  overflow:hidden;

  box-shadow:0 20px 70px #0009;
}


/* 中身 */

.ticketInside{
  position:absolute;
  inset:0;

  border-radius:25px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:30px;

  background:linear-gradient(
    145deg,
    #fff,
    #fff5fa
  );
}

.ticketInside.c{
  border:6px solid #ccc;
}

.ticketInside.b{
  border:7px solid #7b61ff;
  box-shadow:
    inset 0 0 40px #7b61ff33;
}

.ticketInside.a{
  border:8px solid #d4145a;
  box-shadow:
    inset 0 0 50px #d4145a44;
}

.ticketInside.s{
  border:10px solid #f1b400;

  box-shadow:
    inset 0 0 60px #ffe17a,
    0 0 50px #f1b400;
}

.insideRank{
  font-size:48px;
  font-weight:1000;
  color:#d4145a;
}

.insideName{
  font-size:25px;
  font-weight:1000;
  text-align:center;
  margin-top:18px;
}

.insidePos{
  margin-top:25px;
  color:#777;
}


/* =========================
   ペリペリカバー
========================= */

.peelCover{
  position:absolute;
  inset:0;

  border-radius:25px;

  overflow:hidden;

  z-index:10;

  background:
    radial-gradient(
      circle at 50% 30%,
      #ff6699,
      #d4145a 50%,
      #850b3b
    );

  border:8px solid #ffd166;

  touch-action:none;

  transform:
    translateX(0)
    rotate(0deg);

  opacity:1;
}

.peelCover::before{
  content:"";

  position:absolute;

  inset:15px;

  border:3px dashed #ffd166;

  border-radius:18px;
}

.peelLogo{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  pointer-events:none;
}

.peelLogo .icon{
  font-size:85px;
}

.peelLogo .text{
  font-size:32px;
  font-weight:1000;
  color:white;

  text-shadow:
    0 3px 10px #0005;
}

.peelHint{
  position:absolute;

  bottom:35px;

  left:0;
  right:0;

  color:white;

  font-size:18px;
  font-weight:900;

  pointer-events:none;
}


/* 開く */

.peelCover.peeling{

  transition:
    transform 1.7s cubic-bezier(.2,.8,.2,1),
    opacity 1.7s;

  transform:
    translateX(110%)
    rotate(0deg);

  opacity:0;
}


/* =========================
   ボタン
========================= */

.peelButton{
  margin-top:18px;

  background:#ffd166;

  color:#633800;

  box-shadow:
    0 8px 25px #ffd16655;
}


/* =========================
   結果
========================= */

.resultTitle{
  text-align:center;

  font-size:30px;

  font-weight:1000;

  color:#d4145a;
}

.result{
  display:flex;

  justify-content:center;

  margin-top:20px;
}

.tile{
  width:min(360px,100%);

  min-height:180px;

  background:#fff;

  border-radius:20px;

  padding:25px;

  text-align:center;

  display:flex;

  flex-direction:column;

  justify-content:center;

  box-shadow:0 8px 25px #0001;

  animation:appear .5s ease;
}

.tile .rank{
  font-size:34px;
  font-weight:1000;
}

.tile .name{
  font-size:23px;
  font-weight:900;
  margin-top:12px;
}

.tile.S{
  border:6px solid #f1b400;
}

.tile.A{
  border:5px solid #d4145a;
}

.tile.B{
  border:5px solid #7b61ff;
}

@keyframes appear{

  0%{
    transform:scale(.5);
    opacity:0;
  }

  70%{
    transform:scale(1.08);
  }

  100%{
    transform:scale(1);
    opacity:1;
  }

}


/* =========================
   大当たり
========================= */

.bigEffect{
  position:fixed;
  inset:0;

  z-index:8500;

  display:flex;

  align-items:center;
  justify-content:center;

  pointer-events:none;

  opacity:0;
}

.bigEffect.show{
  animation:bigEffect .9s ease;
}

.bigEffectText{
  font-size:clamp(45px,12vw,110px);

  font-weight:1000;

  text-align:center;

  color:#fff;

  text-shadow:
    0 0 10px #fff,
    0 0 30px #d4145a,
    0 0 70px #f1b400;
}

@keyframes bigEffect{

  0%{
    opacity:0;
    transform:scale(.3);
  }

  25%{
    opacity:1;
    transform:scale(1.15);
  }

  70%{
    opacity:1;
    transform:scale(1);
  }

  100%{
    opacity:0;
    transform:scale(1.2);
  }

}


/* =========================
   紙吹雪
========================= */

.confetti{
  position:fixed;

  top:-20px;

  width:10px;
  height:18px;

  z-index:9000;

  pointer-events:none;

  animation:fall linear forwards;
}

@keyframes fall{

  to{
    transform:
      translateY(110vh)
      rotate(720deg);
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .stats{
    grid-template-columns:1fr;
  }

  .peelArea{
    height:450px;
  }

  .insideRank{
    font-size:40px;
  }

  .insideName{
    font-size:21px;
  }

}
</style>

<script>

/* =========================
   設定
========================= */

const PASSWORD="takuya";

const TOTAL=15;

const DAILY_LIMIT=3;


/* =========================
   当たり位置
========================= */

const fixed={

  3:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  6:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  7:{
    rank:"A賞",
    name:"キチチギスex SAR"
  },

  9:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  11:{
    rank:"B賞",
    name:"夜のタンカ SR"
  },

  12:{
    rank:"A賞",
    name:"ミュウex SSR"
  },

  14:{
    rank:"S賞",
    name:"何かの未開封BOX（シュリンク付き）"
  }

};


/* =========================
   AUDIO
========================= */

let audioCtx=null;


function startAudio(){

  if(!audioCtx){

    audioCtx=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

  }

  if(audioCtx.state==="suspended"){

    audioCtx.resume();

  }

}


function tone(
  frequency,
  duration,
  type="sine",
  volume=.08
){

  startAudio();

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type=type;

  osc.frequency.value=
    frequency;

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime+duration
  );

}


/* =========================
   長いペリペリ音
========================= */

function peelSound(){

  startAudio();


  const sounds=[

    [145,.11],
    [165,.11],
    [190,.11],
    [175,.11],
    [205,.11],
    [230,.11],
    [215,.11],
    [245,.11],
    [265,.11],
    [240,.11],
    [280,.11],
    [300,.11],
    [275,.11],
    [315,.11],
    [335,.11],
    [300,.11],
    [350,.11]

  ];


  sounds.forEach((s,i)=>{

    setTimeout(()=>{

      tone(
        s[0],
        s[1],
        "triangle",
        .055
      );

    },i*100);

  });

}


/* =========================
   B賞音
========================= */

function bSound(){

  tone(
    620,
    .15,
    "triangle",
    .12
  );

  setTimeout(()=>{

    tone(
      900,
      .25,
      "triangle",
      .15
    );

  },120);

}


/* =========================
   A賞音
========================= */

function aSound(){

  [700,1000,1400].forEach(
    (n,i)=>{

      setTimeout(()=>{

        tone(
          n,
          .25,
          "triangle",
          .16
        );

      },i*130);

    }
  );

}


/* =========================
   S賞音
========================= */

function sSound(){

  [
    523,
    659,
    784,
    1046,
    1318,
    1568
  ].forEach((n,i)=>{

    setTimeout(()=>{

      tone(
        n,
        .32,
        "triangle",
        .20
      );

    },i*130);

  });

}


/* =========================
   日付
========================= */

function todayKey(){

  return new Date()
    .toLocaleDateString("ja-JP");

}


/* =========================
   データ
========================= */

function load(){

  let d=null;

  try{

    d=JSON.parse(
      localStorage.getItem(
        "oripaData"
      )||"null"
    );

  }catch(e){

    d=null;

  }


  if(
    !d||
    d.date!==todayKey()
  ){

    d={
      date:todayKey(),
      daily:0,
      next:1
    };

  }

  return d;

}


function save(d){

  localStorage.setItem(
    "oripaData",
    JSON.stringify(d)
  );

}


/* =========================
   ログイン
========================= */

function login(){

  const input=
    document
      .getElementById("pw")
      .value
      .trim();


  if(input===PASSWORD){

    sessionStorage.setItem(
      "oripaLogin",
      "1"
    );

    document
      .getElementById("login")
      .classList
      .add("hidden");

    document
      .getElementById("err")
      .textContent="";

  }else{

    document
      .getElementById("err")
      .textContent=
        "パスワードが違います";

  }

}


document
  .getElementById("pw")
  .addEventListener(
    "keydown",
    e=>{

      if(e.key==="Enter"){

        login();

      }

    }
  );


if(
  sessionStorage.getItem(
    "oripaLogin"
  )==="1"
){

  document
    .getElementById("login")
    .classList
    .add("hidden");

}


/* =========================
   残り賞数
========================= */

function calculateRemaining(){

  const d=load();

  let s=1;
  let a=2;
  let b=4;


  for(
    let i=1;
    i<d.next;
    i++
  ){

    if(!fixed[i]){
      continue;
    }


    if(fixed[i].rank==="S賞"){
      s--;
    }

    if(fixed[i].rank==="A賞"){
      a--;
    }

    if(fixed[i].rank==="B賞"){
      b--;
    }

  }


  const drawn=
    d.next-1;


  const special=
    (1-s)+
    (2-a)+
    (4-b);


  const c=
    Math.max(
      0,
      8-(drawn-special)
    );


  return{

    s:Math.max(0,s),

    a:Math.max(0,a),

    b:Math.max(0,b),

    c:c

  };

}


/* =========================
   表示更新
========================= */

function update(){

  const d=load();

  save(d);


  document
    .getElementById("remaining")
    .textContent=
      Math.max(
        0,
        TOTAL+1-d.next
      );


  document
    .getElementById("daily")
    .textContent=
      Math.max(
        0,
        DAILY_LIMIT-d.daily
      );


  document
    .getElementById("draw")
    .disabled=
      d.daily>=DAILY_LIMIT||
      d.next>TOTAL;


  const r=
    calculateRemaining();


  document
    .getElementById("sLeft")
    .textContent=r.s;

  document
    .getElementById("aLeft")
    .textContent=r.a;

  document
    .getElementById("bLeft")
    .textContent=r.b;

  document
    .getElementById("cLeft")
    .textContent=r.c;

}


/* =========================
   ガチャ状態
========================= */

let currentCard=null;

let peeling=false;


/* =========================
   1口引く
========================= */

function drawOne(){

  const d=load();


  if(
    d.daily>=DAILY_LIMIT||
    d.next>TOTAL
  ){

    return;

  }


  startAudio();


  const position=d.next;


  currentCard={

    position:position,

    ...(fixed[position]||{

      rank:"C賞",

      name:"ハズレ"

    })

  };


  d.next++;

  d.daily++;


  save(d);

  update();


  document
    .getElementById("resultCard")
    .classList
    .add("hidden");


  document
    .getElementById("gachaOverlay")
    .classList
    .remove("hidden");


  document
    .getElementById("gachaCount")
    .textContent=
      position+
      "口目";


  showCard();

}


/* =========================
   カード表示
========================= */

function showCard(){

  const inside=
    document.getElementById(
      "ticketInside"
    );


  let type="c";


  if(currentCard.rank==="S賞"){
    type="s";
  }

  if(currentCard.rank==="A賞"){
    type="a";
  }

  if(currentCard.rank==="B賞"){
    type="b";
  }


  inside.className=
    "ticketInside "+type;


  document
    .getElementById("insideRank")
    .textContent=
      currentCard.rank;


  document
    .getElementById("insideName")
    .textContent=
      currentCard.name;


  document
    .getElementById("insidePos")
    .textContent=
      currentCard.position+
      "口目";


  const cover=
    document.getElementById(
      "peelCover"
    );


  /* 毎回まっすぐな状態に戻す */

  cover.classList.remove(
    "peeling"
  );

  cover.style.transition="none";

  cover.style.transform=
    "translateX(0px) rotate(0deg)";

  cover.style.opacity="1";

  void cover.offsetWidth;

  cover.style.transition="";

  peeling=false;


  document
    .getElementById(
      "peelButton"
    )
    .disabled=false;

}


/* =========================
   ペリペリ
========================= */

function peel(){

  if(
    peeling||
    !currentCard
  ){

    return;

  }


  peeling=true;


  const cover=
    document.getElementById(
      "peelCover"
    );


  document
    .getElementById(
      "peelButton"
    )
    .disabled=true;


  cover.style.transform=
    "translateX(0px) rotate(0deg)";


  /* 長いペリペリ音 */

  peelSound();


  setTimeout(()=>{

    cover.style.transition=
      "transform 1.7s cubic-bezier(.2,.8,.2,1), opacity 1.7s";


    cover.style.transform=
      "translateX(110%) rotate(0deg)";


    cover.style.opacity="0";

  },50);


  setTimeout(()=>{

    revealPrize(
      currentCard
    );

  },1800);

}


/* =========================
   ドラッグ
========================= */

let startX=0;

let dragging=false;


const peelCover=
  document.getElementById(
    "peelCover"
  );


peelCover.addEventListener(
  "pointerdown",
  e=>{

    if(peeling){
      return;
    }


    dragging=true;

    startX=e.clientX;


    peelCover.setPointerCapture(
      e.pointerId
    );

  }
);


peelCover.addEventListener(
  "pointermove",
  e=>{

    if(
      !dragging||
      peeling
    ){

      return;

    }


    const dx=
      Math.max(
        0,
        e.clientX-startX
      );


    if(dx>0){

      peelCover.style.transform=
        "translateX("+
        Math.min(dx,130)+
        "px) rotate(0deg)";

    }

  }
);


peelCover.addEventListener(
  "pointerup",
  e=>{

    if(!dragging){
      return;
    }


    dragging=false;


    const dx=
      e.clientX-startX;


    if(dx>70){

      peel();

    }else{

      peelCover.style.transition=
        "transform .25s ease";


      peelCover.style.transform=
        "translateX(0px) rotate(0deg)";

    }

  }
);


/* =========================
   大当たり演出
========================= */

function bigEffect(text){

  const box=
    document.getElementById(
      "bigEffect"
    );


  document
    .getElementById(
      "bigEffectText"
    )
    .textContent=text;


  box.classList.remove("show");

  void box.offsetWidth;

  box.classList.add("show");

}


function makeConfetti(){

  for(
    let i=0;
    i<100;
    i++
  ){

    const c=
      document.createElement(
        "div"
      );


    c.className=
      "confetti";


    c.style.left=
      Math.random()*100+
      "%";


    c.style.background=
      [
        "#ff4d6d",
        "#ffd166",
        "#06d6a0",
        "#118ab2",
        "#8338ec"
      ][
        Math.floor(
          Math.random()*5
        )
      ];


    c.style.animationDuration=
      2+
      Math.random()*2.5+
      "s";


    document.body.appendChild(c);


    setTimeout(
      ()=>{
        c.remove();
      },
      5000
    );

  }

}


/* =========================
   結果表示
========================= */

function revealPrize(card){

  if(card.rank==="B賞"){

    bSound();


    setTimeout(()=>{

      bigEffect(
        "🔥 B賞！！ 🔥"
      );

    },100);

  }


  if(card.rank==="A賞"){

    aSound();


    setTimeout(()=>{

      bigEffect(
        "✨ A賞！！ ✨"
      );

    },100);

  }


  if(card.rank==="S賞"){

    sSound();


    setTimeout(()=>{

      bigEffect(
        "🎉 S賞！！ 🎉"
      );

      makeConfetti();

    },100);

  }


  let wait=900;


  if(card.rank==="B賞"){
    wait=1300;
  }


  if(card.rank==="A賞"){
    wait=1600;
  }


  if(card.rank==="S賞"){
    wait=2100;
  }


  setTimeout(()=>{

    document
      .getElementById(
        "gachaOverlay"
      )
      .classList
      .add("hidden");


    showResult(card);

  },wait);

}


/* =========================
   結果
========================= */

function showResult(card){

  const result=
    document.getElementById(
      "result"
    );


  result.innerHTML="";


  const el=
    document.createElement(
      "div"
    );


  let cls="";


  if(card.rank==="S賞"){
    cls="S";
  }

  if(card.rank==="A賞"){
    cls="A";
  }

  if(card.rank==="B賞"){
    cls="B";
  }


  el.className=
    "tile "+cls;


  el.innerHTML=

    "<div class='rank'>"+
    card.rank+
    "</div>"+

    "<div class='name'>"+
    card.name+
    "</div>"+

    "<small>"+
    card.position+
    "口目"+
    "</small>";


  result.appendChild(el);


  document
    .getElementById("resultTitle")
    .textContent=

      card.rank==="S賞"
        ?"🎉🎉 S賞 大当たり！！ 🎉🎉"

        :card.rank==="A賞"
          ?"✨ A賞 当選！！ ✨"

          :card.rank==="B賞"
            ?"🔥 B賞 当選！！ 🔥"

            :"10連結果";


  document
    .getElementById(
      "resultCard"
    )
    .classList
    .remove("hidden");


  update();


  document
    .getElementById(
      "resultCard"
    )
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =========================
   初期化
========================= */

update();


/*
  10秒ごとに日付を確認。
  0:00を過ぎたら自動的に
  本日の回数を3回へ戻す。
*/

setInterval(
  update,
  10000
);

</script>
